name: Publish verified npm package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified 0.3.0 tarball (false only validates)
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: npm-publish-0.3.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'happy520ai/pm-mcp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      TARBALL: luckychen1993-pm-mcp-0.3.0.tgz
      EXPECTED_SHA256: d01d86033bad541d94e754a7a757687b6890b684ff442eb0abe8ec28ded9636b
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Use the verified OIDC-capable npm CLI
        run: npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund
      - name: Report OIDC claims presented to npm
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value))")
          PAYLOAD=$(printf '%s' "$TOKEN" | cut -d. -f2)
          case $((${#PAYLOAD} % 4)) in 2) PAYLOAD="$PAYLOAD==";; 3) PAYLOAD="$PAYLOAD=";; esac
          printf '%s' "$PAYLOAD" | tr '_-' '/+' | base64 -d \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const c=JSON.parse(s);console.log(JSON.stringify({repository:c.repository,repository_owner:c.repository_owner,workflow_ref:c.workflow_ref,job_workflow_ref:c.job_workflow_ref,ref:c.ref,environment:c.environment,aud:c.aud,event_name:c.event_name},null,2))})"
      - name: Download and verify the released artifact
        run: |
          curl --fail --location --output "$TARBALL" "https://github.com/happy520ai/pm-mcp/releases/download/v0.3.0/$TARBALL"
          echo "$EXPECTED_SHA256  $TARBALL" | sha256sum --check --strict
          npm publish "$TARBALL" --dry-run --ignore-scripts --access public --tag latest
      - name: Publish to npm using the configured trusted publisher
        if: inputs.publish
        run: npm publish "$TARBALL" --ignore-scripts --access public --tag latest
      - name: Verify the public registry artifact
        if: inputs.publish
        run: |
          # 发布成功 ≠ 元数据立即可见：registry CDN 复制有秒级~分钟级延迟，轮询而不是假红。
          for i in $(seq 1 36); do
            if npm view @luckychen1993/pm-mcp@0.3.0 dist.integrity --json > published-integrity.json 2>/dev/null; then break; fi
            if [ "$i" = 36 ]; then echo "registry metadata did not propagate within 3 minutes" >&2; exit 1; fi
            sleep 5
          done
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const expected = 'sha512-' + crypto.createHash('sha512').update(fs.readFileSync(process.env.TARBALL)).digest('base64');
          const actual = JSON.parse(fs.readFileSync('published-integrity.json', 'utf8'));
          if (actual !== expected) throw new Error('Published tarball integrity does not match the verified release');
          console.log('Verified npm 0.3.0 artifact integrity');
          NODE
